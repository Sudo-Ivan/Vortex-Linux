name: Package Vortex Linux
description: Build and validate Linux zip and AppImage artifacts into ./dist

inputs:
  version:
    description: >-
      The version to build (eg: 'v1.0.0'). Leave empty to derive a throwaway
      version from package.json plus today's date.
    required: false
    default: ""

outputs:
  raw-version:
    description: "Packaged version without a leading 'v' (eg: '2.4.0')."
    value: ${{ steps.setOutputs.outputs.rawVersion }}
  tag-version:
    description: "Packaged version with a leading 'v' (eg: 'v2.4.0')."
    value: ${{ steps.setOutputs.outputs.tagVersion }}
  unpacked-artifact:
    description: "Suggested artifact name for ./dist/linux-unpacked."
    value: ${{ steps.setOutputs.outputs.artifactNameUnpacked }}
  packages-artifact:
    description: "Suggested artifact name for zip and AppImage packages."
    value: ${{ steps.setOutputs.outputs.artifactNamePackages }}

runs:
  using: composite
  steps:
    - name: Show Inputs
      shell: bash
      run: |
        echo "version=${{ inputs.version }}"

    - name: Set version
      id: setOutputs
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        rawVersion="${INPUT_VERSION:-}"
        if [[ -z "${rawVersion// }" ]]; then
          pkgVersion="$(node -p "require('./package.json').version")"
          date="$(date +%Y%m%d)"
          rawVersion="${pkgVersion}-nightly.${date}"
        elif [[ "${rawVersion}" == v* ]]; then
          rawVersion="${rawVersion#v}"
        fi
        echo "tagVersion=v${rawVersion}" >> "${GITHUB_OUTPUT}"
        echo "rawVersion=${rawVersion}" >> "${GITHUB_OUTPUT}"
        echo "artifactNameUnpacked=vortex-${rawVersion}-linux-unpacked" >> "${GITHUB_OUTPUT}"
        echo "artifactNamePackages=vortex-${rawVersion}-linux-packages" >> "${GITHUB_OUTPUT}"

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "9.0.x"

    - name: Print dotnet info
      shell: bash
      run: dotnet --info

    - name: Setup Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Cache apt packages
      uses: actions/cache@v6
      with:
        path: /var/cache/apt/archives
        key: apt-package-linux-${{ hashFiles('.github/actions/package-linux/action.yml') }}
        restore-keys: apt-package-linux-

    - name: Install Linux packaging dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          libfontconfig1-dev \
          libfuse2 \
          rpm \
          fakeroot

    - name: Read Node.js version from package.json
      id: node-version
      shell: bash
      run: |
        set -euo pipefail
        nodeVersion="$(node -p "require('./package.json').engines.node")"
        echo "NODE_VERSION=${nodeVersion}" >> "${GITHUB_OUTPUT}"
        echo "Using Node.js version: ${nodeVersion}"

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.node-version.outputs.NODE_VERSION }}
        cache: "pnpm"
        registry-url: "https://registry.npmjs.org"

    - name: Fix pnpm node-gyp permissions
      shell: bash
      run: find "${PNPM_HOME}" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

    - name: Bump versions
      shell: bash
      run: |
        pnpm -F "@vortex/main" -F "@nexusmods/vortex-api" version "${{ steps.setOutputs.outputs.rawVersion }}" --no-git-tag-version --no-git-checks --allow-same-version

    - name: Cache Nx
      uses: actions/cache@v6
      with:
        path: .nx/cache
        key: nx-package-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'rolldown.base.mjs', '**/project.json') }}
        restore-keys: |
          nx-package-linux-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Electron downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
        key: electron-download-package-linux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'src/main/package.json') }}
        restore-keys: |
          electron-download-package-linux-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        VORTEX_ELECTRON_REBUILD: "defer"

    - name: Cache Electron native build headers
      uses: actions/cache@v6
      with:
        path: |
          ~/.electron-gyp
          ~/.cache/node-gyp
        key: package-linux-native-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'src/main/package.json') }}
        restore-keys: |
          package-linux-native-headers-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache bundled .NET runtime
      uses: actions/cache@v6
      with:
        path: src/main/temp/dotnet-runtime
        key: linux-dotnet-runtime-9.0-${{ runner.os }}-${{ runner.arch }}

    - name: Build workspace
      shell: bash
      env:
        NODE_ENV: production
      run: pnpm run build

    - name: Publish dist package
      shell: bash
      env:
        NODE_ENV: production
        VORTEX_ELECTRON_REBUILD: "skip"
      run: pnpm nx run @vortex/main:publish

    - name: Cache packaged Electron native rebuild outputs
      id: packaged-native-cache
      uses: actions/cache@v6
      with:
        path: |
          src/main/dist/node_modules/@nexusmods/fomod-installer-native/build
          src/main/dist/node_modules/@nexusmods/fomod-installer-native/bin
          src/main/dist/node_modules/drivelist/build
          src/main/dist/node_modules/drivelist/bin
          src/main/dist/node_modules/leveldown/build
          src/main/dist/node_modules/leveldown/bin
          src/main/dist/node_modules/winapi-bindings/build
          src/main/dist/node_modules/winapi-bindings/bin
          src/main/dist/node_modules/xxhash-addon/build
          src/main/dist/node_modules/xxhash-addon/bin
          src/main/dist/node_modules/@parcel/watcher/build
          src/main/dist/node_modules/@parcel/watcher/bin
        key: package-linux-dist-electron-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'src/main/package.json', 'src/main/postinstall.mjs') }}
        restore-keys: |
          package-linux-dist-electron-native-${{ runner.os }}-${{ runner.arch }}-

    - name: Rebuild packaged Electron native modules
      if: steps.packaged-native-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: src/main/dist
      run: npx electron-rebuild

    - name: Build Linux packages
      shell: bash
      env:
        # electron-builder hardlinks can EEXIST when the same .node is unpacked twice
        USE_HARD_LINKS: "false"
      run: pnpm -F @vortex/main run package:linux

    - name: Validate Package Creation
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        zips=(./dist/vortex-*.zip)
        appimages=(./dist/vortex-*.AppImage)
        if ((${#zips[@]} == 0)); then
          echo "Linux zip not found in ./dist/" >&2
          ls -la ./dist/ || true
          exit 1
        fi
        if ((${#appimages[@]} == 0)); then
          echo "Linux AppImage not found in ./dist/" >&2
          ls -la ./dist/ || true
          exit 1
        fi
        if [[ ! -f ./dist/linux-unpacked/resources/icons/256x256.png ]]; then
          echo "linux app icon missing from linux-unpacked resources" >&2
          ls -la ./dist/linux-unpacked/resources/icons/ 2>/dev/null || true
          exit 1
        fi
        if [[ ! -f ./dist/linux-unpacked/resources/dotnet/dotnet ]]; then
          echo "bundled dotnet runtime missing from linux-unpacked resources" >&2
          ls -la ./dist/linux-unpacked/resources/dotnet/ 2>/dev/null || true
          exit 1
        fi
        if [[ ! -f ./dist/linux-unpacked/resources/app.asar.unpacked/assets/dotnetprobe ]]; then
          echo "dotnetprobe binary missing from linux-unpacked assets" >&2
          ls -la ./dist/linux-unpacked/resources/app.asar.unpacked/assets/ 2>/dev/null || true
          exit 1
        fi
        if [[ ! -d ./dist/linux-unpacked ]]; then
          echo "linux-unpacked directory not found in ./dist/" >&2
          ls -la ./dist/ || true
          exit 1
        fi
        echo "Package validation successful"
        echo "zip=${zips[0]}"
        echo "appimage=${appimages[0]}"
