name: Main

on:
  push:
    branches: [master, release/*, integration/*]
  pull_request:
    branches: [master, release/*, integration/*, task/laz-*, fix/laz-*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter lists PR files via the API
  pull-requests: read

jobs:
  # Required status checks stay "Expected" forever when a workflow is skipped by
  # paths-ignore, so filter inside the workflow instead: a skipped job reports success.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "!**.md"
              - "!docs/**"
              - "!locales/**"
              - "!.devcontainer/**"
              - "!docker/**"
              - "!flatpak/**"
              - "!*.nix"
              - "!flake.*"
              - "!default.nix"
              - "!shell.nix"
              - "!.env.example"
              - "!.envrc"
              - "!.editorconfig"
              - "!vortex.bat"
              - "!translation-strings.txt"

  build:
    name: Compile (${{ matrix.os }})
    needs: changes
    # Fails open: if the filter job itself fails, code is empty and the full build runs.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code != 'false') }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch comparison base for nx affected
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "${BASE_SHA}"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      # NOTE(erri120): fontconfig required by font-scanner required by theme-switcher
      - name: Install fontconfig
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libseccomp-dev

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'rolldown.base.mjs', '**/project.json') }}
          restore-keys: |
            nx-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-download-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'src/main/package.json') }}
          restore-keys: |
            electron-download-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install
        env:
          VORTEX_ELECTRON_REBUILD: "defer"

      - name: Cache native build headers
        uses: actions/cache@v6
        with:
          path: |
            ~/.electron-gyp
            ~/.cache/node-gyp
          key: native-headers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            native-headers-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron native rebuild outputs
        id: electron-native-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/build
            node_modules/.pnpm/@nexusmods+fomod-installer-native@*/node_modules/@nexusmods/fomod-installer-native/bin
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/build
            node_modules/.pnpm/drivelist@*/node_modules/drivelist/bin
            node_modules/.pnpm/leveldown@*/node_modules/leveldown/build
            node_modules/.pnpm/leveldown@*/node_modules/leveldown/bin
            node_modules/.pnpm/winapi-bindings@*/node_modules/winapi-bindings/build
            node_modules/.pnpm/winapi-bindings@*/node_modules/winapi-bindings/bin
            node_modules/.pnpm/xxhash-addon@*/node_modules/xxhash-addon/build
            node_modules/.pnpm/xxhash-addon@*/node_modules/xxhash-addon/bin
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/build
            node_modules/.pnpm/@parcel+watcher@*/node_modules/@parcel/watcher/bin
          key: electron-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'src/main/postinstall.mjs') }}
          restore-keys: |
            electron-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Rebuild Electron native modules
        if: steps.electron-native-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @vortex/main exec electron-rebuild

      # Affected short-circuits whole-project work: push/PR diffs only build,
      # lint, typecheck and test the projects their changes touch (plus
      # dependents). Manual runs get no base, so they stay a full sweep.
      - name: Build and test
        env:
          NX_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          NX_HEAD: HEAD
        run: |
          if [ -n "${NX_BASE}" ] && [ "${NX_BASE}" != "0000000000000000000000000000000000000000" ]; then
            pnpm nx affected -t build lint typecheck test test:integration --exclude @vortex/e2e
            pnpm run assets
          else
            pnpm run build
            pnpm run test
          fi

  # A skipped matrix job reports one unexpanded "build" check, so the required
  # "build (<os>)" checks come from this gate, which always runs.
  build-status:
    name: build (${{ matrix.os }})
    needs: build
    if: ${{ always() }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        if: ${{ needs.build.result != 'success' && needs.build.result != 'skipped' }}
        run: |
          echo "build result: ${{ needs.build.result }}"
          exit 1
