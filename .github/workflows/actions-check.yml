name: Bundled Actions

# The actions under .github/actions/*/ ship a committed dist/index.js that
# GitHub runs directly - nothing installs or builds them at invocation time.
#
# verify makes sure that dist/index.js is up to date with the source code and tests pass.
# rebuild rebuilds all the dist/index.js files and opens a PR if any of them changed.
#
# Each action is a package in the Vortex workspace named @vortex/<name>-action, so
# both jobs install once at the repo root and drive the actions through nx.
#
# Fork note (Vortex-Linux): rebuild prefers a GitHub App token when APP_ID and
# APP_PRIVATE_KEY are set (upstream Nexus). Otherwise it falls back to
# GITHUB_TOKEN so pushes on this fork do not fail.

on:
  push:
    branches: [master, release/*]
    paths:
      - .github/actions/**
      - .github/workflows/actions-check.yml
      - pnpm-lock.yaml
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/actions-check.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  # Bundling never loads Electron, so skip the native rebuild the app needs.
  VORTEX_ELECTRON_REBUILD: "skip"
  ACTION_PROJECTS: "@vortex/*-action"

jobs:
  verify:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install volta, Node.js
        uses: volta-cli/action@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          cache: true

      - name: Fix pnpm node-gyp permissions
        run: find "$PNPM_HOME" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

      # NOTE(erri120): fontconfig required by font-scanner required by theme-switcher
      - name: Install fontconfig
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, lint and rebuild every bundle
        run: pnpm nx run-many -t typecheck test lint build --projects "$ACTION_PROJECTS"

      - name: Verify committed dist is current
        run: |
          if ! git diff --exit-code -- ':(glob).github/actions/*/dist/**'; then
            echo "::error::A committed bundle is stale. Run 'pnpm nx run-many -t build --projects \"$ACTION_PROJECTS\"' and commit the result."
            exit 1
          fi

  rebuild:
    name: Rebuild Bundles
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          # v3 prefers client-id; APP_ID may hold either app id or client id.
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Select auth token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            {
              echo "token=${APP_TOKEN}"
              echo "app_slug=${APP_SLUG}"
              echo "mode=app"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "token=${FALLBACK_TOKEN}"
              echo "app_slug="
              echo "mode=github_token"
            } >> "${GITHUB_OUTPUT}"
            echo "::notice::APP_ID/APP_PRIVATE_KEY not configured; using GITHUB_TOKEN for bundle rebuild."
          fi

      - name: Get GitHub App User ID
        id: get-user-id
        if: ${{ steps.auth.outputs.mode == 'app' }}
        run: echo "user-id=$(gh api "/users/${{ steps.auth.outputs.app_slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.auth.outputs.token }}

      - name: Configure Git
        env:
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          APP_SLUG: ${{ steps.auth.outputs.app_slug }}
          APP_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          set -euo pipefail
          if [ "${AUTH_MODE}" = "app" ]; then
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

      - name: Install volta, Node.js
        uses: volta-cli/action@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          cache: true

      - name: Fix pnpm node-gyp permissions
        run: find "$PNPM_HOME" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \;

      # NOTE(erri120): fontconfig required by font-scanner required by theme-switcher
      - name: Install fontconfig
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild every bundle
        run: pnpm nx run-many -t build --projects "$ACTION_PROJECTS"

      - name: Open a PR if any bundle changed
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          BASE: ${{ github.ref_name }}
        run: bash .github/scripts/rebuild-action-bundles.sh
