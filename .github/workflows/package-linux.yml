name: Package Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (eg: 'v1.0.0'). Leave empty for a nightly-style version."
        required: false
        type: string
        default: ""
      create-artifacts:
        description: "Upload build artifacts?"
        required: true
        type: boolean
        default: true
      release:
        description: "Create a draft GitHub release on this fork?"
        required: false
        type: boolean
        default: false
      build-flatpak:
        description: "Also build a Flatpak bundle from the Linux zip?"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: package-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      raw-version: ${{ steps.package.outputs.raw-version }}
      tag-version: ${{ steps.package.outputs.tag-version }}
      packages-artifact: ${{ steps.package.outputs.packages-artifact }}
      unpacked-artifact: ${{ steps.package.outputs.unpacked-artifact }}
    env:
      NO_PARALLEL: true
      DEBUG: electron-builder

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Package Vortex for Linux
        id: package
        uses: ./.github/actions/package-linux
        with:
          version: ${{ inputs.version }}

      - name: Upload linux-unpacked artifact
        if: ${{ inputs.create-artifacts || inputs.build-flatpak }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.unpacked-artifact }}
          path: ./dist/linux-unpacked
          if-no-files-found: error
          retention-days: 90

      - name: Upload Linux packages artifact
        if: ${{ inputs.create-artifacts || inputs.release || inputs.build-flatpak }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.packages-artifact }}
          path: |
            ./dist/vortex-*.zip
            ./dist/vortex-*.AppImage
            ./dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 90

  create-github-release:
    name: Create Draft Linux Release
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.packages-artifact }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            ./dist/vortex-*.zip
            ./dist/vortex-*.AppImage
            ./dist/latest-linux.yml
          prerelease: true
          draft: true
          name: ${{ needs.build.outputs.raw-version }} (Linux)
          tag_name: ${{ needs.build.outputs.tag-version }}-linux
          body: |
            Linux packages for Vortex (fork: Sudo-Ivan/Vortex-Linux).

            - `.zip` portable tree
            - `.AppImage` single-file launcher

            Flatpak bundles are published separately when the Flatpak job is enabled.

  flatpak:
    name: Build Flatpak Bundle
    needs: build
    if: ${{ inputs.build-flatpak }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-flatpak-${{ hashFiles('.github/workflows/package-linux.yml', 'flatpak/com.nexusmods.vortex.prebuilt.yaml') }}
          restore-keys: apt-flatpak-

      - name: Cache Flatpak runtimes
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-${{ hashFiles('flatpak/com.nexusmods.vortex.prebuilt.yaml') }}
          restore-keys: flatpak-runtimes-

      - name: Install Flatpak tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Download linux-unpacked artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.unpacked-artifact }}
          path: artifacts/linux-unpacked

      - name: Assemble Flatpak from prebuilt
        run: |
          set -euo pipefail
          python3 flatpak/scripts/flatpak_bundle_prebuilt.py \
            --prebuilt artifacts/linux-unpacked \
            --version "${{ needs.build.outputs.raw-version }}" \
            --output "dist/vortex-${{ needs.build.outputs.raw-version }}.flatpak"

      - name: Upload Flatpak artifact
        if: ${{ inputs.create-artifacts || inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: vortex-${{ needs.build.outputs.raw-version }}-flatpak
          path: ./dist/vortex-*.flatpak
          if-no-files-found: error
          retention-days: 90

      - name: Attach Flatpak to draft release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: ./dist/vortex-*.flatpak
          prerelease: true
          draft: true
          name: ${{ needs.build.outputs.raw-version }} (Linux)
          tag_name: ${{ needs.build.outputs.tag-version }}-linux
